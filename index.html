<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>爱心信封 | 全屏信纸 · 轻触关闭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动干扰 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f9e3d0 0%, #ffccb3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 主容器：只包含信封（无底部按钮） */
        .envelope-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            z-index: 10;
        }

        /* 信封容器 (3D空间) */
        .envelope-container {
            position: relative;
            width: 360px;
            height: 240px;
            perspective: 1000px;
            transform-style: preserve-3d;
            cursor: default;
            transition: opacity 0.3s ease;
        }

        /* 信封主体 */
        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #fdf8ed;
            background-image: radial-gradient(circle at 25% 40%, rgba(255,215,170,0.3) 2%, transparent 2.5%);
            background-size: 18px 18px;
            border-radius: 12px 12px 10px 10px;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,240,0.8);
            transform-style: preserve-3d;
            transition: box-shadow 0.2s;
        }

        /* 信封装饰线 */
        .envelope::before {
            content: "";
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: repeating-linear-gradient(90deg, #e3c9a0, #e3c9a0 8px, transparent 8px, transparent 16px);
            border-radius: 2px;
        }

        /* 封口盖板 (可翻转) */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background: linear-gradient(135deg, #fef5e8 0%, #f8e3ce 100%);
            border-radius: 12px 12px 30px 30px;
            transform-origin: top center;
            transition: transform 0.65s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            z-index: 20;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-bottom: 2px solid #ecd9bf;
        }

        .flap::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 18px;
            background: #e9d2b5;
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            opacity: 0.5;
        }

        /* 爱心按钮 (封口处) */
        .heart-btn {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 44px;
            cursor: pointer;
            z-index: 30;
            transition: all 0.2s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            animation: gentleBeat 1.6s infinite ease-in-out;
            background: transparent;
            border: none;
            line-height: 1;
            pointer-events: auto;
        }

        /* 爱心隐藏状态 (打开信封时隐藏) */
        .heart-btn.hidden-heart {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            animation: none;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.2s, visibility 0.2s;
        }

        @keyframes gentleBeat {
            0% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 0 rgba(255,80,120,0);}
            50% { transform: translate(-50%, -50%) scale(1.12); text-shadow: 0 0 8px rgba(255,60,100,0.6);}
            100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 0 rgba(255,80,120,0);}
        }

        /* 打开信封时：盖子上翻 */
        .envelope-container.open .flap {
            transform: rotateX(180deg);
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }

        /* 打开状态下信封整体微阴影 */
        .envelope-container.open .envelope {
            box-shadow: 0 25px 35px -14px rgba(0, 0, 0, 0.3);
        }

        /* ------------------- 全屏信纸模态窗 (点击背景关闭) ------------------- */
        .fullscreen-letter {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-family: 'Georgia', '楷体', '华文楷书', cursive;
            cursor: pointer;  /* 表示点击背景可关闭 */
        }

        .fullscreen-letter.active {
            visibility: visible;
            opacity: 1;
        }

        /* 信纸卡片：铺满屏幕80% (宽度80%，高度自适应，最大高度80vh) */
        .letter-card {
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            background: #fffef7;
            background: linear-gradient(145deg, #ffffff 0%, #fffaf0 100%);
            border-radius: 32px;
            padding: 2rem 2.2rem;
            box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 170, 0.6);
            transform: scale(0.95);
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            position: relative;
            overflow-y: auto;
            cursor: default;   /* 卡片内部点击不关闭 */
            animation: letterFloat 0.6s ease-out;
        }

        .fullscreen-letter.active .letter-card {
            transform: scale(1);
        }

        @keyframes letterFloat {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 信纸内容样式 */
        .letter-content {
            color: #5a3e2b;
            font-size: 1.2rem;
            line-height: 1.7;
            text-align: left;
        }

        .letter-content h3 {
            text-align: center;
            margin-bottom: 1.2rem;
            color: #c53a1f;
            font-size: 2rem;
            letter-spacing: 3px;
            border-bottom: 2px solid #f3cf9a;
            display: inline-block;
            width: 100%;
        }

        .letter-content p {
            margin: 1rem 0;
            text-indent: 2em;
        }

        .signature {
            text-align: right;
            margin-top: 1.8rem;
            font-style: italic;
            font-size: 1rem;
            color: #b97f4b;
            border-top: 1px dotted #f0cf9e;
            padding-top: 1rem;
        }

        /* 响应式: 小屏幕下适当缩小内边距和字号 */
        @media (max-width: 560px) {
            .envelope-container {
                width: 280px;
                height: 180px;
            }
            .heart-btn {
                font-size: 36px;
                padding: 12px;
            }
            .letter-card {
                padding: 1.2rem;
                width: 92%;
                max-height: 85vh;
            }
            .letter-content {
                font-size: 0.95rem;
                line-height: 1.7;
            }
            .letter-content h3 {
                font-size: 1.4rem;
                letter-spacing: 2px;
            }
            .close-fullscreen {
                width: 40px;
                height: 40px;
                font-size: 24px;
                top: 16px;
                right: 16px;
            }
            .signature {
                margin-top: 1.4rem;
                font-size: 0.9rem;
            }
        }

        /* 针对更小屏幕的优化 */
        @media (max-width: 360px) {
            .envelope-container {
                width: 240px;
                height: 160px;
            }
            .heart-btn {
                font-size: 32px;
            }
            .letter-card {
                padding: 1rem;
                width: 95%;
            }
            .letter-content {
                font-size: 0.9rem;
            }
        }

        /* 信纸内部滚动条美化 */
        .letter-card::-webkit-scrollbar {
            width: 6px;
        }
        .letter-card::-webkit-scrollbar-track {
            background: #f0dbc0;
            border-radius: 10px;
        }
        .letter-card::-webkit-scrollbar-thumb {
            background: #c98f5a;
            border-radius: 10px;
        }

        /* 辅助提示（可选，不影响功能） */
        .helper-tip {
            font-size: 13px;
            color: #b1642c;
            background: rgba(255,235,210,0.7);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 4px 12px;
            margin-top: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="envelope-wrapper">
    <div class="envelope-container" id="envelopeContainer">
        <div class="envelope">
            <!-- 封口翻盖 -->
            <div class="flap"></div>
            <!-- 封口爱心 (点击打开全屏信纸) -->
            <button class="heart-btn" id="heartButton" aria-label="打开信封">❤️</button>
        </div>
    </div>
    <div class="helper-tip">💖 点击爱心打开信纸 · 轻触背景即可收起 ✨</div>
</div>

<!-- 全屏信纸浮层 (点击空白区域关闭) -->
<div class="fullscreen-letter" id="fullscreenLetter">
    <div class="letter-card">
        <div class="letter-content">
            <h3>✨ 见信如晤 ✨</h3>
            <p>亲爱的朋友：</p>
            <p>当你打开这封铺满温暖的信笺时，世界都变得柔软起来。愿此刻的浪漫，如星子落入眼眸，点亮平凡日常。</p>
            <p>感谢你触碰这颗爱心，让藏在信封里的絮语，化作清风，萦绕在你的身旁。每一个字句都是为你而生的心意，每一次呼吸都带着墨香。</p>
            <p>或许我们相隔屏幕，但此刻心意相通。请收下这份独属于你的诗意时光，愿美好永驻心间。</p>
            <div class="signature">
                🌟 一封全屏信笺 · 轻触背景即归 <br>
                —— 来自数字宇宙的暖意
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // DOM 元素
        const envelopeContainer = document.getElementById('envelopeContainer');
        const heartBtn = document.getElementById('heartButton');
        const fullscreenLayer = document.getElementById('fullscreenLetter');
        
        // 状态管理
        let isOpen = false;          // 信封是否处于打开状态（flap翻开 + 爱心隐藏 + 全屏信纸可见）
        let isAnimating = false;     // 防止动画中重复触发
        
        // 辅助函数：隐藏爱心
        function hideHeart() {
            heartBtn.classList.add('hidden-heart');
        }
        
        // 显示爱心
        function showHeart() {
            heartBtn.classList.remove('hidden-heart');
        }
        
        // 打开信封 + 显示全屏信纸
        function openEnvelopeAndFullscreen() {
            if (isOpen || isAnimating) return;
            isAnimating = true;
            
            // 1. 添加打开类 -> flap 翻转动画
            envelopeContainer.classList.add('open');
            
            // 2. 隐藏爱心
            hideHeart();
            
            // 3. 延迟一点展示全屏信纸 (让盖子翻起更自然)
            setTimeout(() => {
                fullscreenLayer.classList.add('active');
                // 锁定背景滚动
                document.body.style.overflow = 'hidden';
                isOpen = true;
                isAnimating = false;
            }, 200);
        }
        
        // 关闭全屏信纸 + 合上信封 (爱心重新出现)
        function closeFullscreenAndResetEnvelope() {
            if (isAnimating) return;
            // 如果已经关闭并且全屏未激活，不需要操作
            if (!isOpen && !fullscreenLayer.classList.contains('active')) return;
            
            isAnimating = true;
            
            // 1. 移除全屏信纸 (渐隐)
            fullscreenLayer.classList.remove('active');
            document.body.style.overflow = '';   // 恢复滚动
            
            // 2. 等待全屏关闭动画一点点，再合上信封盖
            setTimeout(() => {
                // 移除信封 open 类 -> flap 回位动画
                envelopeContainer.classList.remove('open');
                
                // 3. 重新显示爱心
                showHeart();
                
                // 重置打开状态
                isOpen = false;
                
                // 动画解锁
                setTimeout(() => {
                    isAnimating = false;
                }, 300);
            }, 280);
        }
        
        // 爱心点击事件
        function onHeartClick(e) {
            e.stopPropagation();
            if (isOpen || isAnimating) return;
            if (fullscreenLayer.classList.contains('active')) return;
            openEnvelopeAndFullscreen();
        }
        
        // 点击全屏背景关闭 (信纸外部区域)
        function onFullscreenBackgroundClick(e) {
            // 只有点击到 .fullscreen-letter 本身（背景遮罩）才触发关闭
            // 避免点击内部 letter-card 时关闭
            if (e.target === fullscreenLayer) {
                closeFullscreenAndResetEnvelope();
            }
        }
        
        // 绑定事件
        heartBtn.addEventListener('click', onHeartClick);
        fullscreenLayer.addEventListener('click', onFullscreenBackgroundClick);
        
        // 触摸设备优化 (防止双击缩放干扰)
        heartBtn.addEventListener('touchstart', (e) => {
            if (isOpen || isAnimating) return;
            e.preventDefault();
            onHeartClick(e);
        }, { passive: false });
        
        // 移动端关闭按钮触摸支持
        closeFsBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            closeFullscreenAndResetEnvelope();
        }, { passive: false });
        
        // 移动端点击背景关闭支持
        fullscreenLayer.addEventListener('touchstart', (e) => {
            if (e.target === fullscreenLayer) {
                e.preventDefault();
                closeFullscreenAndResetEnvelope();
            }
        }, { passive: false });
        
        // 确保全屏层打开时背景滚动锁定，关闭时解锁 (额外保险)
        fullscreenLayer.addEventListener('transitionend', (e) => {
            if (!fullscreenLayer.classList.contains('active')) {
                document.body.style.overflow = '';
            } else {
                document.body.style.overflow = 'hidden';
            }
        });
        
        // 初始化: 确保信封关闭、爱心可见、全屏隐藏
        const initState = () => {
            envelopeContainer.classList.remove('open');
            fullscreenLayer.classList.remove('active');
            showHeart();
            isOpen = false;
            isAnimating = false;
            document.body.style.overflow = '';
        };
        initState();
        
        // 盖子动画结束后，确保状态同步（双重保险）
        envelopeContainer.addEventListener('transitionend', (e) => {
            if (e.propertyName === 'transform' && !envelopeContainer.classList.contains('open')) {
                if (!isOpen) showHeart();
            }
        });
        
        // 如果全屏信纸打开时，按下 ESC 键也可以关闭（增强体验）
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fullscreenLayer.classList.contains('active')) {
                closeFullscreenAndResetEnvelope();
            }
        });
        
        // 爱心重新显示后恢复呼吸动画 (MutationObserver 确保动画重启动效)
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mut) => {
                if (mut.attributeName === 'class' && !heartBtn.classList.contains('hidden-heart')) {
                    // 重置动画，让爱心重新开始跳动
                    heartBtn.style.animation = 'none';
                    heartBtn.offsetHeight; // 强制重绘
                    heartBtn.style.animation = '';
                }
            });
        });
        observer.observe(heartBtn, { attributes: true });
        
        // 优雅处理窗口resize不干扰全屏状态
        window.addEventListener('resize', () => {
            if (fullscreenLayer.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            }
        });
        
        // 阻止信纸卡片内滚动事件冒泡到背景层 (避免拖动时意外关闭)
        const letterCard = document.querySelector('.letter-card');
        if (letterCard) {
            letterCard.addEventListener('wheel', (e) => e.stopPropagation());
            // 防止触摸滑动时触发背景关闭
            letterCard.addEventListener('touchstart', (e) => e.stopPropagation());
        }
    })();
</script>
</body>
</html>
